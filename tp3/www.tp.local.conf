# TP3 - serveur web en TLS 1.2/1.3 avec authentification mutuelle (mTLS)
server {
    listen 443 ssl;
    server_name www.tp.local;

    # Chaine presentee par le serveur : certificat + intermediaire (jamais la racine)
    ssl_certificate     /etc/nginx/tls/serveur_chaine.crt;
    ssl_certificate_key /etc/nginx/tls/serveur.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    # Suites TLS 1.2 : uniquement ECDHE (confidentialite persistante) + AEAD.
    # (le certificat est ECDSA, donc seules des suites ECDHE-ECDSA sont utilisables)
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305;
    ssl_session_tickets off;

    # Authentification mutuelle des clients
    ssl_client_certificate /etc/nginx/tls/racine.crt;
    ssl_verify_client on;
    ssl_verify_depth 2;
    ssl_crl /etc/nginx/tls/crls.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        return 200 "Bonjour $ssl_client_s_dn\n";
    }
}
